<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select — Atomic Oasis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Righteous&family=Pacifico&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../dist/style.css">
<script type="module">
  import '../dist/index.js';
  import { initTheme } from '../dist/theme.js';
  initTheme();
</script>
<style>
  body { padding: 24px; background: var(--bg); color: var(--text); font-family: var(--font-body); margin: 0; max-width: 400px; }
</style>
</head>
<body>

<ao-select label="Select a vibe">
  <option>Poolside lounge</option>
  <option>Desert sunset</option>
  <option>Mid-century lanai</option>
</ao-select>
<ao-select label="Departure time" error="Please select a valid time slot.">
  <option value="">Choose one…</option>
  <option>Morning</option>
  <option>Afternoon</option>
</ao-select>

</body>
</html>
