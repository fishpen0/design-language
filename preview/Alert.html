<!-- @dsCard group="Components" name="Alert" subtitle="success · info · warning · danger" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alert — Atomic Oasis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Righteous&family=Pacifico&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../dist/style.css">
<script type="module">
  import '../dist/index.js';
  import { initTheme } from '../dist/theme.js';
  initTheme();
</script>
<style>
  body { padding: 24px; background: var(--bg); color: var(--text); font-family: var(--font-body); margin: 0; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>

<div class="stack">
  <ao-alert tone="success" heading="Liftoff successful">Your reservation is confirmed for two at the lagoon.</ao-alert>
  <ao-alert tone="info" heading="Did you know?">Toggle the theme — every token flips, including the breeze screens.</ao-alert>
  <ao-alert tone="warning" heading="Heads up">Your session expires in five minutes.</ao-alert>
  <ao-alert tone="danger" heading="Payment failed">We couldn't process that card. Try another.</ao-alert>
</div>

</body>
</html>
