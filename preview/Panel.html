<!-- @dsCard group="Components" name="Panel" subtitle="default · flat" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel — Atomic Oasis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Righteous&family=Pacifico&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../dist/style.css">
<script type="module">
  import '../dist/index.js';
  import { initTheme } from '../dist/theme.js';
  initTheme();
</script>
<style>
  body { padding: 24px; background: var(--bg); color: var(--text); font-family: var(--font-body); margin: 0; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .panel-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
</style>
</head>
<body>

<div class="stack">
  <div>
    <div class="panel-label">Default (hard shadow)</div>
    <ao-panel><p style="margin:0">Surface with ink border and offset box-shadow. Use for cards, dialogs, and grouped content.</p></ao-panel>
  </div>
  <div>
    <div class="panel-label">Flat (no shadow)</div>
    <ao-panel flat><p style="margin:0">Flat variant — same border, no shadow. Good for inset sections or secondary groupings.</p></ao-panel>
  </div>
</div>

</body>
</html>
